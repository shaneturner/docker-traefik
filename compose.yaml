networks:
  traefik:
    external: true
  socket_proxy:
    internal: true

services:
  socket-proxy:
    image: wollomatic/socket-proxy:1
    container_name: traefik-socket-proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 64M
    read_only: true
    cap_drop:
      - ALL
    networks:
      - socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=traefik'
      - '-allowHEAD=/_ping'
      - '-allowGET=/v1\..{1,2}/(version|containers/.*|networks/.*|events.*)'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'

  traefik:
    image: traefik:3
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # Uncomment for production
    networks:
      - traefik
      - socket_proxy
    volumes:
      - ./config/traefik-local.yaml:/etc/traefik/traefik.yaml:ro
      # - ./config/traefik-prod.yaml:/etc/traefik/traefik.yaml:ro  # Uncomment for production (and comment out local)
      - ./config/conf/:/etc/traefik/conf/:ro
      # - ./letsencrypt:/letsencrypt  # Uncomment for production
      # - ./logs:/var/log/traefik  # Uncomment for production
    # environment:  # Uncomment for production with Cloudflare DNS challenge
    #   - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    depends_on:
      - socket-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik.service=api@internal"
