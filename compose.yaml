networks:
  traefik:
    external: true
  socket_proxy:
    internal: true

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: traefik-socket-proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1  # Allow Traefik to access container information
      - NETWORKS=1    # Allow Traefik to access network information
      - SERVICES=0    # Disable services access (not needed for Docker provider)
      - TASKS=0       # Disable tasks access (not needed for Docker provider)
      - POST=0        # Disable POST requests (read-only)
      - BUILD=0       # Disable build access
      - COMMIT=0      # Disable commit access
      - CONFIGS=0     # Disable configs access
      - DISTRIBUTION=0  # Disable distribution access
      - EXEC=0        # Disable exec access
      - IMAGES=0      # Disable images access (not needed)
      - INFO=0        # Disable info access
      - NODES=0       # Disable nodes access
      - PLUGINS=0     # Disable plugins access
      - SECRETS=0     # Disable secrets access
      - SESSION=0     # Disable session access
      - SWARM=0       # Disable swarm access
      - SYSTEM=0      # Disable system access
      - VOLUMES=0     # Disable volumes access

  traefik:
    image: traefik:3
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # Uncomment for production
    networks:
      - traefik
      - socket_proxy
    volumes:
      - ./config/traefik-local.yaml:/etc/traefik/traefik.yaml:ro
      # - ./config/traefik-prod.yaml:/etc/traefik/traefik.yaml:ro  # Uncomment for production (and comment out local)
      - ./config/conf/:/etc/traefik/conf/:ro
      # - ./letsencrypt:/letsencrypt  # Uncomment for production
      # - ./logs:/var/log/traefik  # Uncomment for production
    # environment:  # Uncomment for production with Cloudflare DNS challenge
    #   - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    depends_on:
      - socket-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
